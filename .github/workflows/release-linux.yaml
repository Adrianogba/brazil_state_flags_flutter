name: Linux release build

# The Windows and Android artifacts are built and attached from a Windows
# machine. Flutter desktop builds are host-only, so the Linux bundle has to
# come from a Linux runner.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundle to (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build the example
        working-directory: example
        run: |
          flutter pub get
          flutter build linux --release

      - name: Resolve the tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package the bundle
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          VERSION="${VERSION#v}"
          NAME="brazil_state_flags_example-${VERSION}-linux-x64.tar.gz"
          tar -czf "$NAME" -C example/build/linux/x64/release/bundle .
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            "${{ steps.package.outputs.name }}" --clobber
